<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Remplacé par la valeur de « --base-href » au moment du build
    (/tournee-calendriers/ sur GitHub Pages, / en local).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Suivi de la tournée des calendriers des pompiers de Saint-Héand.">
  <meta name="theme-color" content="#C62828">

  <!-- iOS : app installée sur l'écran d'accueil (ARCHITECTURE §7.9) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- « default » : l'app ne passe pas sous l'heure et la batterie -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tournée">
  <!-- Icônes dessinées par tool/icones/dessiner_icones_test.dart (variante
       orange dans icons/test/, remplacée par tool/generer_sw.dart en test). -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="icons/favicon.png"/>

  <title>Tournée calendriers</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Écran de chargement, retiré par flutter_bootstrap.js quand l'app est prête. */
    #chargement {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      font-family: -apple-system, system-ui, sans-serif; color: #555; background: #fff;
    }
    #chargement .rond {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #eee; border-top-color: #C62828;
      animation: tourne 0.9s linear infinite;
    }
    @keyframes tourne { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="chargement">
    <div class="rond"></div>
    <div>Chargement de la carte…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
