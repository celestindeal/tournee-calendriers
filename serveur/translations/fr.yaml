configuration:
  cle_synchro:
    name: Clé de synchronisation
    description: >-
      La même clé que le secret SYNCHRO_CLE du dépôt GitHub (intégrée à l'app : personne n'a rien à taper).
      12 caractères minimum : lettres, chiffres et tirets.
  nom_tailscale:
    name: Nom du serveur sur Tailscale
    description: Donne le début de l'adresse publique (https://serveur-pompier.xxxx.ts.net).
  cle_tailscale:
    name: Clé d'authentification Tailscale (facultative)
    description: >-
      Inutile en général : au premier démarrage, un lien de connexion s'affiche dans le journal.
