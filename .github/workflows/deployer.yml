# Publie l'app sur GitHub Pages, en deux environnements :
#   - production : branche main → https://celestindeal.github.io/tournee-calendriers/
#   - test       : branche test → https://celestindeal.github.io/tournee-calendriers/test/
#
# GitHub Pages ne publie qu'un site par dépôt : chaque déploiement reconstruit
# donc les DEUX branches et les publie ensemble. Seule la branche poussée est
# analysée et testée ; rien n'est publié si cela échoue.

name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la production (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: prod

      - name: Récupérer le test (test)
        uses: actions/checkout@v7
        with:
          ref: test
          path: test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # même version que sur le PC
          channel: stable
          cache: true

      - name: Analyser et tester la branche poussée (${{ github.ref_name }})
        working-directory: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # --no-web-resources-cdn : moteur de rendu servi par l'app (hors-ligne, ARCHITECTURE §7.2)
      # VERSION_APP : identifiant court du commit, affiché dans la page Diagnostic
      # SYNCHRO_ADRESSE (variable du dépôt) et SYNCHRO_CLE (secret) : serveur de
      # synchronisation intégré à l'app (vides = pas de synchronisation)
      - name: Construire la production
        working-directory: prod
        env:
          SYNCHRO_ADRESSE: ${{ vars.SYNCHRO_ADRESSE }}
          SYNCHRO_CLE: ${{ secrets.SYNCHRO_CLE }}
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --base-href /tournee-calendriers/ \
            --dart-define=ENV=prod --dart-define=VERSION_APP=$(git rev-parse --short=7 HEAD) \
            --dart-define=SYNCHRO_ADRESSE="$SYNCHRO_ADRESSE" --dart-define=SYNCHRO_CLE="$SYNCHRO_CLE"
          dart run tool/generer_sw.dart --environnement prod

      - name: Construire le test
        working-directory: test
        env:
          SYNCHRO_ADRESSE: ${{ vars.SYNCHRO_ADRESSE }}
          SYNCHRO_CLE: ${{ secrets.SYNCHRO_CLE }}
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --base-href /tournee-calendriers/test/ \
            --dart-define=ENV=test --dart-define=VERSION_APP=$(git rev-parse --short=7 HEAD) \
            --dart-define=SYNCHRO_ADRESSE="$SYNCHRO_ADRESSE" --dart-define=SYNCHRO_CLE="$SYNCHRO_CLE"
          dart run tool/generer_sw.dart --environnement test

      - name: Assembler le site (production + test/)
        run: |
          mkdir -p site/test
          cp -r prod/build/web/. site/
          cp -r test/build/web/. site/test/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
